name: Run  Go Unit Tests

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache CycloneDDS build
        uses: actions/cache@v3
        with:
          path: .cyclonedds/install
          key: ${{ runner.os }}-cyclonedds-0.10.x-v2

      - name: Build CycloneDDS (from source; see Makefile)
        run: make install-cyclonedds

      - name: Run unit tests
        run: make test
